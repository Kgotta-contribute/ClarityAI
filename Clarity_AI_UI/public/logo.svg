<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="clarityWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="100" height="100" rx="22" fill="#0b1120" />
  
  <!-- Waveform Equalizer Bars with Glow -->
  <g filter="url(#glow)">
    <!-- Bar 1 (Outer Left) -->
    <rect x="13" y="36" width="10" height="28" rx="5" fill="url(#clarityWaveGrad)" />
    <!-- Bar 2 (Inner Left) -->
    <rect x="30" y="22" width="10" height="56" rx="5" fill="url(#clarityWaveGrad)" />
    <!-- Bar 3 (Center Tallest) -->
    <rect x="47" y="12" width="10" height="76" rx="5" fill="url(#clarityWaveGrad)" />
    <!-- Bar 4 (Inner Right) -->
    <rect x="64" y="22" width="10" height="56" rx="5" fill="url(#clarityWaveGrad)" />
    <!-- Bar 5 (Outer Right) -->
    <rect x="81" y="36" width="10" height="28" rx="5" fill="url(#clarityWaveGrad)" />
  </g>
</svg>
